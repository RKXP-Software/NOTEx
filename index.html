<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>NOTEx</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/mobile.css" />
    <link rel="stylesheet" href="/src/sync.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="app">
      <header id="toolbar" class="toolbar" role="toolbar" aria-label="Barra de ferramentas"></header>
      <div id="body">
        <aside id="sidebar" aria-label="Cadernos"></aside>
        <div id="sidebar-resizer" class="divider divider-row" aria-hidden="true"></div>
        <main id="workspace"></main>
      </div>
      <footer class="statusbar">
        <span id="st-path"></span>
        <span class="spacer"></span>
        <span id="st-status"></span>
        <span id="st-words"></span>
        <span id="st-pos"></span>
        <span id="st-kind"></span>
        <span id="st-enc"></span>
        <span id="st-sync"></span>
        <span id="st-version" title="Versão do NOTEx"></span>
        <span class="zoom" role="group" aria-label="Zoom do texto">
          <button id="zoom-out" title="Diminuir zoom (Ctrl+-)" aria-label="Diminuir zoom">−</button>
          <button id="zoom-reset" title="Voltar a 100% (Ctrl+0)">100%</button>
          <button id="zoom-in" title="Aumentar zoom (Ctrl++)" aria-label="Aumentar zoom">+</button>
        </span>
      </footer>
    </div>
  </body>
</html>
