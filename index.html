<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NOTEx</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="app">
      <header id="toolbar" class="toolbar" role="toolbar" aria-label="Barra de ferramentas"></header>

        <aside id="sidebar" aria-label="Cadernos"></aside>
        <div id="sidebar-resizer" class="divider divider-row" aria-hidden="true"></div>
