[package]
name = "notex"
version = "0.4.1"
description = "Bloco de notas leve com abas, cadernos e sincronização"
authors = ["RKXP Software"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "notex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Sincronização: criptografia, hash, codificação e cliente HTTP (TLS para o Google Drive; na rede local o conteúdo já vai cifrado).
chacha20poly1305 = "0.10"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

# Servidor de sincronização e QR code de pareamento: só no desktop.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tiny_http = "0.12"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
if-addrs = "0.13"
hostname = "0.4"
# Abrir o NOTEx de novo traz a janela existente (evita duas cópias disputando a porta 47800).
tauri-plugin-single-instance = "2"

# Leitura do QR code pela câmera: só no celular.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "=2.4.6"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
